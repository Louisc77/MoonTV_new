name: Weekly upstream sync PR
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Merge upstream into sync branch and open PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Stardm0/MoonTV.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date"; exit 0
          fi
          git checkout -B sync-upstream origin/main
          git merge upstream/main -m "Sync upstream"
          git push -f origin sync-upstream
          if [ -z "$(gh pr list --head sync-upstream --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head sync-upstream \
              --title "Sync upstream (Stardm0/MoonTV)" \
              --body "每週自動同步上游更新。確認後再合併。"
          fi
